name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            install_cmd: npm install --ignore-scripts
            builder_args: --mac dmg zip --arm64
          - os: windows-latest
            platform: win
            install_cmd: npm install
            builder_args: --win nsis --x64
          - os: ubuntu-latest
            platform: linux
            install_cmd: npm install
            builder_args: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing package.json version to $VERSION"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install dependencies
        run: ${{ matrix.install_cmd }}

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: |
          node scripts/clean-dist-electron.cjs
          npx vite build

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weflow-${{ matrix.platform }}
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release and upload files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find artifacts -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No artifact files found!" >&2
            exit 1
          fi
          echo "Found ${#files[@]} files to attach."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading files..."
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$REPO"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG" --repo "$REPO" "${files[@]}"
          fi
